<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <!-- Perforated outer border pattern -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#f7ede2"/>
      <stop offset="100%" stop-color="#dfcaa9"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c3317"/>
      <stop offset="100%" stop-color="#1a120b"/>
    </linearGradient>
    <!-- Perforation cutouts -->
    <mask id="perforations">
      <rect x="0" y="0" width="400" height="480" fill="white"/>
      <!-- Top & Bottom perfs -->
      <circle cx="20" cy="0" r="6" fill="black"/><circle cx="20" cy="480" r="6" fill="black"/><circle cx="40" cy="0" r="6" fill="black"/><circle cx="40" cy="480" r="6" fill="black"/><circle cx="60" cy="0" r="6" fill="black"/><circle cx="60" cy="480" r="6" fill="black"/><circle cx="80" cy="0" r="6" fill="black"/><circle cx="80" cy="480" r="6" fill="black"/><circle cx="100" cy="0" r="6" fill="black"/><circle cx="100" cy="480" r="6" fill="black"/><circle cx="120" cy="0" r="6" fill="black"/><circle cx="120" cy="480" r="6" fill="black"/><circle cx="140" cy="0" r="6" fill="black"/><circle cx="140" cy="480" r="6" fill="black"/><circle cx="160" cy="0" r="6" fill="black"/><circle cx="160" cy="480" r="6" fill="black"/><circle cx="180" cy="0" r="6" fill="black"/><circle cx="180" cy="480" r="6" fill="black"/><circle cx="200" cy="0" r="6" fill="black"/><circle cx="200" cy="480" r="6" fill="black"/><circle cx="220" cy="0" r="6" fill="black"/><circle cx="220" cy="480" r="6" fill="black"/><circle cx="240" cy="0" r="6" fill="black"/><circle cx="240" cy="480" r="6" fill="black"/><circle cx="260" cy="0" r="6" fill="black"/><circle cx="260" cy="480" r="6" fill="black"/><circle cx="280" cy="0" r="6" fill="black"/><circle cx="280" cy="480" r="6" fill="black"/><circle cx="300" cy="0" r="6" fill="black"/><circle cx="300" cy="480" r="6" fill="black"/><circle cx="320" cy="0" r="6" fill="black"/><circle cx="320" cy="480" r="6" fill="black"/><circle cx="340" cy="0" r="6" fill="black"/><circle cx="340" cy="480" r="6" fill="black"/><circle cx="360" cy="0" r="6" fill="black"/><circle cx="360" cy="480" r="6" fill="black"/><circle cx="380" cy="0" r="6" fill="black"/><circle cx="380" cy="480" r="6" fill="black"/>
      <!-- Left & Right perfs -->
      <circle cx="0" cy="20" r="6" fill="black"/><circle cx="400" cy="20" r="6" fill="black"/><circle cx="0" cy="40" r="6" fill="black"/><circle cx="400" cy="40" r="6" fill="black"/><circle cx="0" cy="60" r="6" fill="black"/><circle cx="400" cy="60" r="6" fill="black"/><circle cx="0" cy="80" r="6" fill="black"/><circle cx="400" cy="80" r="6" fill="black"/><circle cx="0" cy="100" r="6" fill="black"/><circle cx="400" cy="100" r="6" fill="black"/><circle cx="0" cy="120" r="6" fill="black"/><circle cx="400" cy="120" r="6" fill="black"/><circle cx="0" cy="140" r="6" fill="black"/><circle cx="400" cy="140" r="6" fill="black"/><circle cx="0" cy="160" r="6" fill="black"/><circle cx="400" cy="160" r="6" fill="black"/><circle cx="0" cy="180" r="6" fill="black"/><circle cx="400" cy="180" r="6" fill="black"/><circle cx="0" cy="200" r="6" fill="black"/><circle cx="400" cy="200" r="6" fill="black"/><circle cx="0" cy="220" r="6" fill="black"/><circle cx="400" cy="220" r="6" fill="black"/><circle cx="0" cy="240" r="6" fill="black"/><circle cx="400" cy="240" r="6" fill="black"/><circle cx="0" cy="260" r="6" fill="black"/><circle cx="400" cy="260" r="6" fill="black"/><circle cx="0" cy="280" r="6" fill="black"/><circle cx="400" cy="280" r="6" fill="black"/><circle cx="0" cy="300" r="6" fill="black"/><circle cx="400" cy="300" r="6" fill="black"/><circle cx="0" cy="320" r="6" fill="black"/><circle cx="400" cy="320" r="6" fill="black"/><circle cx="0" cy="340" r="6" fill="black"/><circle cx="400" cy="340" r="6" fill="black"/><circle cx="0" cy="360" r="6" fill="black"/><circle cx="400" cy="360" r="6" fill="black"/><circle cx="0" cy="380" r="6" fill="black"/><circle cx="400" cy="380" r="6" fill="black"/><circle cx="0" cy="400" r="6" fill="black"/><circle cx="400" cy="400" r="6" fill="black"/><circle cx="0" cy="420" r="6" fill="black"/><circle cx="400" cy="420" r="6" fill="black"/><circle cx="0" cy="440" r="6" fill="black"/><circle cx="400" cy="440" r="6" fill="black"/><circle cx="0" cy="460" r="6" fill="black"/><circle cx="400" cy="460" r="6" fill="black"/>
    </mask>
  </defs>

  <!-- Stamp Paper with Perforations -->
  <g mask="url(#perforations)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="480" fill="url(#paperGrad)"/>
    
    <!-- Outer Engraved Border Frame -->
    <rect x="18" y="18" width="364" height="444" fill="none" stroke="#5c3317" stroke-width="2"/>
    <rect x="22" y="22" width="356" height="436" fill="none" stroke="#5c3317" stroke-width="6"/>
    <rect x="30" y="30" width="340" height="420" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-dasharray="4,2"/>
    
    <!-- Top Header Ribbon -->
    <path d="M 32 32 L 368 32 L 368 76 L 32 76 Z" fill="url(#vignette)"/>
    <text x="200" y="55" font-family="'Georgia', serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      INDIA POSTAGE
    </text>
    <text x="200" y="70" font-family="'Georgia', serif" font-size="9" font-weight="700" fill="#e0a96d" text-anchor="middle" letter-spacing="2">
      ★ COMMEMORATIVE SERIES ★
    </text>

    <!-- Central Vignette Box -->
    <rect x="42" y="86" width="316" height="294" fill="url(#vignette)" stroke="#e0a96d" stroke-width="2" rx="4"/>
    <rect x="46" y="90" width="308" height="286" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Central Artwork -->
    <g transform="translate(42, 86)">
      
    <!-- Sunburst behind portrait -->
    <circle cx="158" cy="147" r="110" fill="#84481d" opacity="0.6"/>
    <circle cx="158" cy="147" r="85" fill="#fdf6ee"/>
    <!-- Gandhi Portrait Drawing -->
    <g transform="translate(158, 142) scale(0.95)">
      <!-- Head / Bald silhouette with spectacles -->
      <path d="M -45 -10 C -48 -60 48 -60 45 -10 C 45 40 20 60 0 65 C -20 60 -45 40 -45 -10 Z" fill="#edd6bf" stroke="#4a250d" stroke-width="2"/>
      <!-- Ears -->
      <path d="M -45 -15 C -55 -15 -55 10 -45 15 Z" fill="#e0c2a6" stroke="#4a250d" stroke-width="1.5"/>
      <path d="M 45 -15 C 55 -15 55 10 45 15 Z" fill="#e0c2a6" stroke="#4a250d" stroke-width="1.5"/>
      <!-- Spectacles round wire -->
      <circle cx="-16" cy="-8" r="14" fill="none" stroke="#2d1506" stroke-width="2.5"/>
      <circle cx="16" cy="-8" r="14" fill="none" stroke="#2d1506" stroke-width="2.5"/>
      <line x1="-2" y1="-8" x2="2" y2="-8" stroke="#2d1506" stroke-width="2.5"/>
      <!-- Eyes behind glasses -->
      <circle cx="-16" cy="-8" r="3" fill="#2d1506"/>
      <circle cx="16" cy="-8" r="3" fill="#2d1506"/>
      <!-- Nose -->
      <path d="M 0 -8 L -3 14 L 4 14" fill="none" stroke="#5c3317" stroke-width="2"/>
      <!-- Mustache & Smile -->
      <path d="M -18 24 Q 0 32 18 24" fill="none" stroke="#4a250d" stroke-width="2.5"/>
      <path d="M -12 36 Q 0 42 12 36" fill="none" stroke="#5c3317" stroke-width="2"/>
      <!-- Khadi shawl draped -->
      <path d="M -75 75 Q -30 40 0 70 Q 30 40 75 75 L 75 110 L -75 110 Z" fill="#fdfaf6" stroke="#4a250d" stroke-width="2"/>
    </g>
    <!-- Label -->
    <rect x="30" y="250" width="256" height="30" fill="#2a1405" rx="3"/>
    <text x="158" y="271" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#f7ede2" text-anchor="middle" letter-spacing="2">
      MAHATMA GANDHI 1869-1948
    </text>
  
    </g>

    <!-- Bottom Denomination & Ribbon -->
    <path d="M 32 390 L 368 390 L 368 448 L 32 448 Z" fill="url(#vignette)"/>
    <text x="200" y="420" font-family="'Georgia', serif" font-size="24" font-weight="900" fill="#e0a96d" text-anchor="middle" letter-spacing="2">
      10 RS. / १० रुपये
    </text>
    <text x="200" y="438" font-family="'Georgia', serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      ISSUE OF 1948
    </text>

    <!-- Authentic Postal Ink Postmark / Cancellation Stamp -->
    <g transform="translate(290, 110) rotate(-22)" opacity="0.75">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#2c1d11" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#2c1d11" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="-36" y1="-8" x2="36" y2="-8" stroke="#2c1d11" stroke-width="1.5"/>
      <line x1="-38" y1="8" x2="38" y2="8" stroke="#2c1d11" stroke-width="1.5"/>
      <text x="0" y="-14" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="#2c1d11" text-anchor="middle" letter-spacing="1.5">
        NEW DELHI G.P.O. · 1948
      </text>
      <text x="0" y="3" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#2c1d11" text-anchor="middle">
        15 AUG 1948
      </text>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#2c1d11" text-anchor="middle">
        DELIVERY
      </text>
      <!-- Wavy cancellation lines -->
      <path d="M 44 -15 Q 60 -25 76 -15 T 108 -15 M 44 0 Q 60 -10 76 0 T 108 0 M 44 15 Q 60 5 76 15 T 108 15" fill="none" stroke="#2c1d11" stroke-width="2"/>
    </g>
  </g>
</svg>